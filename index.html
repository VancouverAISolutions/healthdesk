/* ─── HELPERS ─── */

function today() { return new Date("2026-05-10"); }

function credStatus(dateStr) {
  const d = new Date(dateStr);
  const t = today();
  const diff = (d - t) / (1000 * 60 * 60 * 24);
  if (diff < 0)  return "expired";
  if (diff <= 30) return "expiring";
  return "ok";
}

function StatusDot({ status }) {
  const cls = status === "expired" ? "bg-red-500" : status === "expiring" ? "bg-yellow-400" : "bg-green-500";
  return <span className={`inline-block w-2.5 h-2.5 rounded-full ${cls} mr-1.5`} />;
}

function CredBadge({ date }) {
  const s = credStatus(date);
  const label = s === "expired" ? "Expired" : s === "expiring" ? "Expiring" : "OK";
  const cls = s === "expired"
    ? "bg-red-100 text-red-700 border border-red-300"
    : s === "expiring"
    ? "bg-yellow-100 text-yellow-700 border border-yellow-300"
    : "bg-green-100 text-green-700 border border-green-300";
  return (
    <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${cls}`}>
      <StatusDot status={s} />{date}
    </span>
  );
}

                      {row.caregiver.split(" ")[0]} {row.caregiver.split(" ")[1][0]}.

                    <div className="text-gray-400 text-xs mt-0.5 ml-4">{row.time}</div>
                  </td>
                  {[0,1,2,3,4,5,6].map(day => (
                    <td key={day} className={`px-1 py-1.5 text-center cal-cell align-top ${day === 0 ? "bg-teal-50" : ""}`}>
                      {row.days.includes(day) ? (
                        <div className={`rounded-lg px-1 py-1 ${col.bg} ${col.text} font-medium`}>
                          ✓
                          <div className="text-xs font-normal opacity-70">{row.time.split("–")[0]}</div>
                        </div>
                      ) : (
                        <span className="text-gray-200">—</span>
                      )}
                    </td>
                  ))}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   SCREEN 4: Compliance Tracker
═══════════════════════════════════════════════ */
function ComplianceScreen() {
  const overdue  = COMPLIANCE.filter(c => c.status === "overdue").length;
  const dueSoon  = COMPLIANCE.filter(c => c.status === "due-soon").length;
  const ok       = COMPLIANCE.filter(c => c.status === "ok").length;

  const badgeClass = s =>
    s === "overdue"  ? "bg-red-100 text-red-700 border border-red-200"
    : s === "due-soon" ? "bg-yellow-100 text-yellow-700 border border-yellow-200"
    : "bg-green-100 text-green-700 border border-green-200";
  const badgeLabel = s =>
    s === "overdue" ? "Overdue" : s === "due-soon" ? "Due Soon" : "On Track";

  return (
    <div className="fade-in">
      <div className="mb-6">
        <h1 className="text-2xl font-bold text-gray-800">Compliance Tracker</h1>
        <p className="text-sm text-gray-500 mt-1">Training, certifications &amp; audits</p>
      </div>

      <div className="grid grid-cols-3 gap-4 mb-6">
        <div className="bg-white rounded-xl p-4 shadow-sm border border-red-100 text-center">
          <div className="text-3xl font-bold text-red-500">{overdue}</div>
          <div className="text-xs text-gray-500 mt-1 font-medium">Overdue</div>
        </div>
        <div className="bg-white rounded-xl p-4 shadow-sm border border-yellow-100 text-center">
          <div className="text-3xl font-bold text-yellow-500">{dueSoon}</div>
          <div className="text-xs text-gray-500 mt-1 font-medium">Due Soon</div>
        </div>
        <div className="bg-white rounded-xl p-4 shadow-sm border border-green-100 text-center">
          <div className="text-3xl font-bold text-green-500">{ok}</div>
          <div className="text-xs text-gray-500 mt-1 font-medium">On Track</div>
        </div>
      </div>

      <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-gray-50 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
              <th className="px-4 py-3">Compliance Item</th>
              <th className="px-4 py-3">Assignee</th>
              <th className="px-4 py-3">Due Date</th>
              <th className="px-4 py-3">Status</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-50">
            {COMPLIANCE.map(c => (
              <tr key={c.id} className="hover:bg-gray-50 transition-colors">
                <td className="px-4 py-3 font-medium text-gray-800">{c.item}</td>
                <td className="px-4 py-3 text-gray-600">{c.assignee}</td>
                <td className="px-4 py-3 text-gray-600">{c.due}</td>
                <td className="px-4 py-3">
                  <span className={`inline-flex px-2.5 py-0.5 rounded-full text-xs font-semibold ${badgeClass(c.status)}`}>
                    {badgeLabel(c.status)}
                  </span>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════
   SCREEN 5: Billing & Invoices
═══════════════════════════════════════════════ */
function BillingScreen() {
  const total   = INVOICES.reduce((s, i) => s + i.amount, 0);
  const paid    = INVOICES.filter(i => i.status === "paid").reduce((s, i) => s + i.amount, 0);
  const pending = INVOICES.filter(i => i.status === "pending").reduce((s, i) => s + i.amount, 0);
  const overdue = INVOICES.filter(i => i.status === "overdue").reduce((s, i) => s + i.amount, 0);

  const fmt = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits:2, maximumFractionDigits:2 });

  const statusClass = s =>
    s === "paid"    ? "bg-green-100 text-green-700 border border-green-200"
    : s === "pending" ? "bg-blue-100 text-blue-700 border border-blue-200"
    : "bg-red-100 text-red-700 border border-red-200";

  return (
    <div className="fade-in">
      <div className="mb-6">
        <h1 className="text-2xl font-bold text-gray-800">Billing &amp; Invoices</h1>
        <p className="text-sm text-gray-500 mt-1">April 2026 billing period</p>
      </div>

      {/* Summary bar */}
      <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-100">
          <div className="text-xs text-gray-500 font-medium mb-1">Total Billed</div>
          <div className="text-xl font-bold text-gray-800">{fmt(total)}</div>
        </div>
        <div className="bg-white rounded-xl p-4 shadow-sm border border-green-100">
          <div className="text-xs text-gray-500 font-medium mb-1">Collected</div>
          <div className="text-xl font-bold text-green-600">{fmt(paid)}</div>
        </div>
        <div className="bg-white rounded-xl p-4 shadow-sm border border-blue-100">
          <div className="text-xs text-gray-500 font-medium mb-1">Pending</div>
          <div className="text-xl font-bold text-blue-600">{fmt(pending)}</div>
        </div>
        <div className="bg-white rounded-xl p-4 shadow-sm border border-red-100">
          <div className="text-xs text-gray-500 font-medium mb-1">Overdue</div>
          <div className="text-xl font-bold text-red-500">{fmt(overdue)}</div>
        </div>
      </div>

      {/* Collection rate bar */}
      <div className="bg-white rounded-xl p-4 shadow-sm border border-gray-100 mb-6">
        <div className="flex justify-between text-xs text-gray-500 mb-2">
          <span>Collection Rate</span>
          <span>{Math.round(paid/total*100)}%</span>
        </div>
        <div className="w-full bg-gray-100 rounded-full h-2.5">
          <div className="bg-teal-500 h-2.5 rounded-full" style={{width: `${Math.round(paid/total*100)}%`}} />
        </div>
        <div className="flex justify-between text-xs mt-2">
          <span className="text-green-600">{fmt(paid)} collected</span>
          <span className="text-gray-400">{fmt(total)} total</span>
        </div>
      </div>

      <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-gray-50 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
              <th className="px-4 py-3">Invoice #</th>
              <th className="px-4 py-3">Client</th>
              <th className="px-4 py-3">Amount</th>
              <th className="px-4 py-3">Issued</th>
              <th className="px-4 py-3">Due</th>
              <th className="px-4 py-3">Status</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-gray-50">
            {INVOICES.map(inv => (
              <tr key={inv.id} className="hover:bg-gray-50 transition-colors">
                <td className="px-4 py-3 font-mono text-xs text-gray-600">{inv.id}</td>
                <td className="px-4 py-3 font-medium text-gray-800">{inv.client}</td>
                <td className="px-4 py-3 font-semibold text-gray-800">{fmt(inv.amount)}</td>
                <td className="px-4 py-3 text-gray-500">{inv.issued}</td>
                <td className="px-4 py-3 text-gray-500">{inv.due}</td>
                <td className="px-4 py-3">
                  <span className={`inline-flex px-2.5 py-0.5 rounded-full text-xs font-semibold capitalize ${statusClass(inv.status)}`}>
                    {inv.status}
                  </span>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════

═══════════════════════════════════════════════ */

        {/* Nav */}
        <nav className="flex-1 px-3 py-4 space-y-1">

            <button className="relative p-1.5 rounded-lg text-gray-400 hover:bg-gray-50 hover:text-gray-600 transition-colors">

                page === n.id ? "text-teal-600" : "text-gray-400"

            >

              <span className="leading-tight text-center" style={{fontSize:"10px"}}>

              {page === n.id && <span className="w-1 h-1 rounded-full bg-teal-500 mt-0.5" />}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
